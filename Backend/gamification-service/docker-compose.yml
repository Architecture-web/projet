# Infrastructure locale pour le service : PostgreSQL 15 + RabbitMQ (avec interface web).
#   docker compose up -d
services:
  postgres:
    image: postgres:15
    container_name: skillquest-gamification-db
    environment:
      POSTGRES_DB: skillquest_gamification
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - gamification-pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: skillquest-rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Interface web : http://localhost:15672 (guest / guest)

volumes:
  gamification-pgdata:
