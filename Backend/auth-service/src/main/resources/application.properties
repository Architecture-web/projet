server.port=8081

# Database Configuration (PostgreSQL par défaut)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/skillquest_auth}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=skillquest_super_secret_jwt_key_2026_at_least_256_bits_long_and_robust_security
app.jwt.expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# Inter-Service URL (Synchrone REST)
app.services.gamification-url=http://localhost:8084

# Import local credentials if present (ignored by git)
spring.config.import=optional:classpath:application-local.properties

# GitHub OAuth2 Configuration
app.oauth.github.client-id=${GITHUB_CLIENT_ID:YOUR_GITHUB_CLIENT_ID}
app.oauth.github.client-secret=${GITHUB_CLIENT_SECRET:YOUR_GITHUB_CLIENT_SECRET}

# Google OAuth2 Configuration
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
app.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
